name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Прогоны на живом приложении. Юнит-тесты выше проверяют логику, но не то,
  # что человек видит: панели, переключение языка, ленту, гейты одобрения.
  # Раньше это гонялось только руками перед релизом — и зелёная галочка
  # означала меньше, чем выглядела.
  #
  # Здесь только те прогоны, которым не нужны ни сеть, ни живой Claude: агенты
  # идут через фейковый драйвер (ZARYA_FAKE_AGENT), профиль у каждого свой и
  # временный. Проверено на Ubuntu до включения; сейчас здесь пятнадцать прогонов.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Electron нужен дисплей — на раннере его нет, поэтому xvfb.
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Panes
        run: xvfb-run -a node scripts/panes-test.mjs

      - name: Language
        run: xvfb-run -a node scripts/i18n-test.mjs

      - name: Progress
        run: xvfb-run -a node scripts/progress-test.mjs

      - name: Agent engines (fake driver)
        run: xvfb-run -a node scripts/qa-fake-agents.mjs

      # Своя модель распознавания. Настоящих весов здесь нет: проверяется, что
      # Заря на пустышки НЕ соглашается и объясняет отказ словами, а чужие файлы
      # остаются на диске. Полный путь на живой модели — qa:voice-custom, он
      # качает 100 МБ и гоняется руками.
      - name: Custom speech model
        run: xvfb-run -a node scripts/stt-custom-test.mjs

      # Чужие клавиши не одобряют команды: Enter в окне «введите имя» не должен
      # заодно разрешать инструмент, ожидающий решения в панели.
      - name: Gate keys
        run: xvfb-run -a node scripts/gate-keys-test.mjs

      # Сворачиваемые разделы сайдбара: «недавние» не должны закрывать собой
      # живую работу, и это состояние обязано переживать перезапуск.
      - name: Sidebar folding
        run: xvfb-run -a node scripts/sidebar-fold-test.mjs

      # Внимание человека: «ждёт тебя» и «работает» — разные состояния, и зов
      # приходит только когда окно не в фокусе.
      - name: Attention
        run: xvfb-run -a node scripts/attention-test.mjs

      # Пол под автопилотом: необратимое спрашивают всегда, а «до конца сессии»
      # снимает вопрос только про ту самую команду.
      - name: Gate floor
        run: xvfb-run -a node scripts/gate-floor-test.mjs

      # Здоровье инструментов: состояние каждого MCP-сервера, причина отказа
      # дословно, и четыре отказа, которые легче всего подменить пустотой —
      # включая «без нажатия движок не опрашиваем» (health-check запускает
      # серверы по-настоящему).
      - name: MCP panel
        run: xvfb-run -a node scripts/mcp-panel-test.mjs

      # Скиллы: их цена в каждом запросе и четыре состояния движка. Отдельно
      # проверяется, что переключателя НЕТ там, где он соврал бы, — у плагинных
      # скиллов и у перекрытых настройками проекта.
      - name: Skills panel
        run: xvfb-run -a node scripts/skills-panel-test.mjs

      # Запись состояния скилла настоящим драйвером в подменённый дом: чужие
      # ключи конфига обязаны пережить правку, а возврат «в работе» — не
      # оставить следов Зари в чужом файле.
      - name: Skill write
        run: xvfb-run -a node scripts/skill-write-test.mjs

      # Команды, перечитывание и наблюдатель — по СВОЕЙ панели: две беседы в
      # разных папках не должны отвечать друг за друга, а проектные скиллы
      # обязаны попадать под наблюдение (папка процесса к ним отношения не
      # имеет).
      - name: Extras routing
        run: xvfb-run -a node scripts/extras-routing-test.mjs

      # Палитра и сайдбар: раздел «Агент» появляется только там, где движок это
      # умеет; столы ищутся по имени; Ctrl+B возвращает тот раздел, что был.
      - name: Palette
        run: xvfb-run -a node scripts/palette-test.mjs

      # Модель и усилие — своей панели: две панели на разных движках не должны
      # подписываться одной моделью. Топливо при этом остаётся общим — лимит
      # подписки один на аккаунт.
      - name: Pane status
        run: xvfb-run -a node scripts/pane-status-test.mjs

      # Поиск ищет по тому, что на экране: в блочном режиме по ленте, в сыром —
      # по терминалу. Раньше лупа всегда работала по xterm, который в блочном
      # режиме рендерится за экраном.
      - name: Feed search
        run: xvfb-run -a node scripts/feed-search-test.mjs

      # Первый экран: показывается только тому, кто ставит Зарю впервые, ничего
      # не отправляет и ничего не устанавливает сам. Прогон запускает приложение
      # трижды — чистый профиль, повторный запуск и профиль «обновившегося».
      - name: Onboarding
        run: xvfb-run -a node scripts/onboarding-test.mjs
