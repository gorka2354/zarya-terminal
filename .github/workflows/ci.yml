name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Прогоны на живом приложении. Юнит-тесты выше проверяют логику, но не то,
  # что человек видит: панели, переключение языка, ленту, гейты одобрения.
  # Раньше это гонялось только руками перед релизом — и зелёная галочка
  # означала меньше, чем выглядела.
  #
  # Здесь только те прогоны, которым не нужны ни сеть, ни живой Claude: агенты
  # идут через фейковый драйвер (ZARYA_FAKE_AGENT), профиль у каждого свой и
  # временный. Проверено на Ubuntu до включения; сейчас здесь семь прогонов.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Electron нужен дисплей — на раннере его нет, поэтому xvfb.
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Panes
        run: xvfb-run -a node scripts/panes-test.mjs

      - name: Language
        run: xvfb-run -a node scripts/i18n-test.mjs

      - name: Progress
        run: xvfb-run -a node scripts/progress-test.mjs

      - name: Agent engines (fake driver)
        run: xvfb-run -a node scripts/qa-fake-agents.mjs

      # Своя модель распознавания. Настоящих весов здесь нет: проверяется, что
      # Заря на пустышки НЕ соглашается и объясняет отказ словами, а чужие файлы
      # остаются на диске. Полный путь на живой модели — qa:voice-custom, он
      # качает 100 МБ и гоняется руками.
      - name: Custom speech model
        run: xvfb-run -a node scripts/stt-custom-test.mjs

      # Чужие клавиши не одобряют команды: Enter в окне «введите имя» не должен
      # заодно разрешать инструмент, ожидающий решения в панели.
      - name: Gate keys
        run: xvfb-run -a node scripts/gate-keys-test.mjs

      # Сворачиваемые разделы сайдбара: «недавние» не должны закрывать собой
      # живую работу, и это состояние обязано переживать перезапуск.
      - name: Sidebar folding
        run: xvfb-run -a node scripts/sidebar-fold-test.mjs

      # Внимание человека: «ждёт тебя» и «работает» — разные состояния, и зов
      # приходит только когда окно не в фокусе.
      - name: Attention
        run: xvfb-run -a node scripts/attention-test.mjs

      # Пол под автопилотом: необратимое спрашивают всегда, а «до конца сессии»
      # снимает вопрос только про ту самую команду.
      - name: Gate floor
        run: xvfb-run -a node scripts/gate-floor-test.mjs
