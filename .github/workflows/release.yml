name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            builder-flag: --win
            artifact-name: zarya-windows
            artifact-glob: |
              release/*.exe
              release/*.blockmap
              release/latest.yml
          - os: macos-latest
            builder-flag: --mac
            artifact-name: zarya-macos
            artifact-glob: |
              release/*.dmg
              release/*.blockmap
              release/latest-mac.yml
          - os: ubuntu-latest
            builder-flag: --linux
            artifact-name: zarya-linux
            artifact-glob: |
              release/*.AppImage
              release/*.deb
              release/*.blockmap
              release/latest-linux.yml
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        # The renderer bundle is large (Monaco + xterm + the language grammars) and
        # the macOS arm64 runner OOM-killed rollup at the default heap.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run build

      - name: Package with electron-builder
        run: npx electron-builder --publish never ${{ matrix.builder-flag }}

      # Контрольные суммы считаются на том же раннере, что собрал файлы, — иначе
      # это просто хеш чего-то, а не подтверждение сборки. Приложение показывает
      # их на странице «Что нового», чтобы скачанное можно было сверить.
      - name: Checksums
        shell: bash
        run: |
          cd release
          # Без списка файлов shasum читал бы stdin и работа висела бы до
          # таймаута. Пусто здесь — это провал сборки, а не «нечего считать».
          # Только дистрибутивы: суммы нужны человеку для сверки скачанного,
          # а метаданные обновления проверяет сам electron-updater.
          files=$(ls *.exe *.dmg *.AppImage *.deb 2>/dev/null || true)
          if [ -z "$files" ]; then
            echo "не найдено ни одного файла сборки" >&2
            exit 1
          fi
          # Инструмент разный на трёх платформах: в Git Bash на Windows есть
          # sha256sum (coreutils из MSYS), но нет shasum (perl); на macOS всё
          # наоборот. Проверять надо наличие, а не платформу.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum $files > "SHA256SUMS-${{ matrix.artifact-name }}.txt"
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 $files > "SHA256SUMS-${{ matrix.artifact-name }}.txt"
          else
            echo "нечем посчитать SHA256" >&2
            exit 1
          fi
          cat "SHA256SUMS-${{ matrix.artifact-name }}.txt"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            ${{ matrix.artifact-glob }}
            release/SHA256SUMS-*.txt
          if-no-files-found: error

  # Отдельная работа: страница релиза создаётся ОДИН раз, когда все три сборки
  # готовы. Раньше её создавали руками — из-за этого тег v0.5.2 остался без
  # релиза, и проверка обновлений не увидела бы новую версию вовсе.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Collect files
        run: |
          mkdir -p out
          find dist-artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) -exec cp {} out/ \;
          # Метаданные автообновления: latest*.yml говорит приложению, какая
          # версия вышла, каким файлом и с каким sha512 — без них electron-updater
          # не работает вовсе. .blockmap даёт разностное скачивание (качается не
          # весь установщик, а изменившиеся куски).
          find dist-artifacts -type f \( -name 'latest*.yml' -o -name '*.blockmap' \) -exec cp {} out/ \;
          # Суммы с трёх раннеров сводятся в один файл — на странице релиза
          # человеку нужен один список, а не три. Ищем find'ом, а не глобом:
          # upload-artifact сохраняет каталог `release/` внутри артефакта, и
          # `dist-artifacts/*/SHA256SUMS-*.txt` ничего бы не нашёл.
          find dist-artifacts -type f -name 'SHA256SUMS-*.txt' -exec cat {} + \
            > "out/SHA256SUMS-${GITHUB_REF_NAME#v}.txt"
          ls -la out
          # Пустой релиз хуже отсутствующего: он выглядит выпущенным.
          test -s "out/SHA256SUMS-${GITHUB_REF_NAME#v}.txt"
          # Релиз без latest.yml выглядит нормальным, но молча ломает
          # автообновление у всех, кто уже поставил приложение.
          test -f out/latest.yml
          test "$(find out -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) | wc -l)" -gt 0

      # actions/checkout забирает тег как обычную ссылку, БЕЗ объекта аннотации.
      # Из-за этого `gh --notes-from-tag` молча падал на сообщение коммита, и в
      # релиз 0.5.4 уехало «chore(release): …» вместо написанного человеком
      # описания — того самого, что приложение показывает на странице «Что
      # нового». Дотягиваем аннотированный тег явно.
      - name: Fetch annotated tag
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Описание берётся из аннотации тега — оно пишется при выпуске и
          # показывается пользователю в приложении. Если аннотации нет, лучше
          # упасть, чем выпустить релиз с текстом служебного коммита.
          notes=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")
          if [ -z "${notes// /}" ]; then
            echo "у тега нет аннотации — описание релиза брать неоткуда" >&2
            exit 1
          fi
          printf '%s\n' "$notes" > release-notes.txt
          gh release create "$GITHUB_REF_NAME" out/* \
            --title "Zarya ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.txt \
            --verify-tag

      # Подписать релиз CI не может по построению: ключ живёт у мейнтейнера, и
      # положить его сюда значило бы отдать подпись любому, кто получил доступ к
      # конвейеру. Поэтому шаг ручной — и о нём надо напомнить громко: без
      # подписи установленные копии обновление сами не поставят.
      - name: Напоминание о подписи
        run: |
          v="${GITHUB_REF_NAME#v}"
          {
            echo "## Релиз опубликован — осталась подпись"
            echo ""
            echo "Установленные копии **не поставят** это обновление сами, пока список сумм не подписан."
            echo ""
            echo '```'
            echo "node scripts/sign-release.mjs $v"
            echo '```'
            echo ""
            echo "Ключ — только на машине мейнтейнера (см. SECURITY.md)."
          } >> "$GITHUB_STEP_SUMMARY"
